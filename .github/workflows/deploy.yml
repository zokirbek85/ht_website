name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Update and restart application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            set -e
            cd /var/www/hazorasp-textil
            git fetch origin main
            git reset --hard origin/main
            SHARP_FORCE_GLOBAL_LIBVIPS=1 npm ci --include=optional --ignore-scripts
            MAKEFLAGS=-j1 SHARP_FORCE_GLOBAL_LIBVIPS=1 npm rebuild sharp --build-from-source
            NODE_OPTIONS=--max-old-space-size=768 npm run build
            sudo systemctl restart hazorasp-textil
          '
